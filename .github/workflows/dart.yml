name: Flutter CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Install system dependencies for Flutter
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y curl unzip xz-utils git

      # 3. Install Flutter manually to ensure Dart SDK ≥ 3.10
      - name: Install Flutter 3.13.0
        run: |
          FLUTTER_VERSION=3.13.0
          wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$FLUTTER_VERSION-stable.tar.xz
          tar xf flutter_linux_$FLUTTER_VERSION-stable.tar.xz
          echo "$PWD/flutter/bin" >> $GITHUB_PATH

      # 4. Verify Flutter and Dart versions
      - name: Verify Flutter and Dart installation
        run: |
          flutter --version
          dart --version

      # 5. Cache Flutter dependencies for faster runs
      - name: Cache Flutter Pub packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .packages
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # 6. Get project dependencies
      - name: Install dependencies
        run: flutter pub get

      # 7. Analyze project source
      - name: Analyze project source
        run: flutter analyze


      # 9. Optional: Build APK for Android
      - name: Build APK
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release

      # 10. Upload APK as artifact
      - name: Upload APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
